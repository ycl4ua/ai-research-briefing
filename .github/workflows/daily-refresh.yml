name: Refresh daily AI briefing

on:
  schedule:
    # 08:00 America/Phoenix. GitHub cron uses UTC.
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh digest
        run: python pipeline/ai_briefing.py --refresh

      - name: Commit updated digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/digests/daily.json
          if git diff --cached --quiet; then
            echo "No digest changes to commit."
          else
            git commit -m "Refresh daily briefing"
            git push
          fi

